name: build-windows-exe

on:
  workflow_dispatch:        # кнопка "Run workflow" у вкладці Actions
  push:
    branches: [main]
    paths: ['raw_studio.py', '.github/workflows/build-windows-exe.yml']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Show version
        shell: bash
        run: |
          VER=$(grep -oE 'APP_VERSION *= *"[0-9.]+"' raw_studio.py | grep -oE '[0-9.]+' | tail -1)
          echo "RAW Studio v${VER:-UNKNOWN} (raw_studio.py у репозиторії)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install numpy matplotlib pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --windowed --clean --noconfirm --hidden-import matplotlib.backends.backend_tkagg --name RAW_Studio raw_studio.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAW_Studio_windows
          path: dist/RAW_Studio.exe
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RAW_Studio.exe
